<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>스플렌더 온라인</title>
  <!-- PWA: 아이폰/아이패드 홈 화면 설치용 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#103626">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스플렌더">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 홈: 방 만들기 / 입장 -->
  <div id="screen-home" class="screen active">
    <div class="home-box">
      <h1>💎 스플렌더</h1>
      <p class="subtitle">보석을 모아 15점을 먼저 달성하세요 (2~4인)</p>
      <input id="input-name" type="text" maxlength="12" placeholder="닉네임">
      <button id="btn-create" class="primary">방 만들기 (호스트)</button>
      <button id="btn-solo" class="primary solo">🤖 혼자 하기 (AI와 대전)</button>
      <button id="btn-hotseat" class="primary hotseat">👥 같이 하기 (한 기기에서 교대)</button>
      <div class="join-row">
        <input id="input-code" type="text" maxlength="4" placeholder="방 코드">
        <button id="btn-join">입장</button>
      </div>
      <p id="home-error" class="error"></p>
      <p class="install-hint">📱 아이폰·아이패드: Safari에서 열고 <b>공유 → 홈 화면에 추가</b>하면 앱으로 설치됩니다</p>
    </div>
  </div>

  <!-- 대기실 -->
  <div id="screen-lobby" class="screen">
    <div class="home-box">
      <h1>대기실</h1>
      <p class="subtitle">친구에게 방 코드를 알려주세요</p>
      <div id="lobby-code" class="room-code"></div>
      <button id="btn-copy-url" class="copy-url">🔗 초대 링크 복사</button>
      <p id="lobby-url" class="subtitle" style="word-break:break-all"></p>
      <ul id="lobby-players" class="player-list"></ul>
      <div id="lobby-options" class="options-box">
        <div class="opt-title">게임 규칙 <span class="hint">(호스트만 변경 가능)</span></div>
        <div class="opt-row">
          <label for="opt-time">턴 제한시간</label>
          <select id="opt-time"></select>
        </div>
        <div class="opt-row">
          <label for="opt-score">목표 점수</label>
          <select id="opt-score"></select>
        </div>
        <div class="opt-row">
          <label for="opt-first">선 플레이어</label>
          <select id="opt-first">
            <option value="order">차례대로</option>
            <option value="random">랜덤</option>
          </select>
        </div>
        <div class="opt-row">
          <label for="opt-bot">봇 난이도</label>
          <select id="opt-bot">
            <option value="easy">쉬움</option>
            <option value="normal" selected>보통</option>
            <option value="hard">어려움</option>
          </select>
        </div>
        <div class="opt-row">
          <label for="opt-reserve">예약(킵) 한도</label>
          <select id="opt-reserve"></select>
        </div>
        <div class="opt-row">
          <label for="opt-noble">귀족 타일 수</label>
          <select id="opt-noble"></select>
        </div>
        <div class="opt-row">
          <label for="opt-skin">카드 스킨 <span class="hint">(내 화면에만 적용)</span></label>
          <select id="opt-skin"></select>
        </div>
      </div>
      <div id="local-add" class="join-row" style="display:none;margin-bottom:10px">
        <input id="input-local-name" type="text" maxlength="12" placeholder="추가할 플레이어 이름">
        <button id="btn-addlocal">➕ 추가</button>
      </div>
      <button id="btn-addbot" style="display:none;margin-bottom:10px">🤖 봇 추가</button>
      <button id="btn-start" class="primary" style="display:none">게임 시작</button>
      <p id="lobby-hint" class="subtitle"></p>
      <p id="lobby-error" class="error"></p>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="screen-game" class="screen">
    <div id="game-topbar">
      <span class="topbar-title">💎 스플렌더 <span id="topbar-code" class="topbar-code"></span></span>
      <span id="turn-timer" class="turn-timer"></span>
      <span class="topbar-btns">
        <button id="btn-skin" title="카드 스킨 변경">🎨 스킨</button>
        <button id="btn-restart" style="display:none">🔄 다시하기</button>
        <button id="btn-exit">나가기</button>
      </span>
    </div>
    <div id="players-bar"></div>
    <div class="game-main">
      <div class="board-col">
        <div id="nobles-row"></div>
        <div id="board"></div>
      </div>
      <div class="side-col">
        <div class="bank-box">
          <h3>은행 <span class="hint">(서로 다른 3개 또는 같은 색 2개)</span></h3>
          <div id="bank"></div>
          <div id="take-bar">
            <span id="take-sel"></span>
            <button id="btn-take" class="primary" disabled>토큰 가져오기</button>
          </div>
        </div>
        <div class="my-box">
          <h3 id="my-title">내 보유</h3>
          <div id="my-tokens"></div>
          <div id="my-bonuses"></div>
          <h4>예약(킵)한 카드</h4>
          <div id="my-reserved"></div>
        </div>
        <div class="log-box">
          <h3>기록</h3>
          <div id="log"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="modal" class="modal-overlay" style="display:none">
    <div id="modal-body" class="modal-box"></div>
  </div>

  <div id="toast"></div>

  <!-- 상대 경로: 서버(루트)와 GitHub Pages(서브패스) 양쪽에서 동작. Pages에는 socket.io가 없어 로드 실패 → 오프라인 모드로 동작 -->
  <script src="socket.io/socket.io.js"></script>
  <!-- 오프라인(로컬) 게임 엔진: 혼자 하기·같이 하기는 서버 없이 동작 -->
  <script src="game/cards.js"></script>
  <script src="game/game.js"></script>
  <script src="game/ai.js"></script>
  <script src="local.js"></script>
  <script src="client.js"></script>
</body>
</html>
